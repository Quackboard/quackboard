<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuackBoard Iframe Embed Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <!-- 1. Load the Embed Script -->
    <div class="box">
        <h1>QuackBoard Iframe Embed Test</h1>

        <div id="quackboard-calendar-saafir-bhimani"></div>
    </div>
    <script>
        (function () {
            var script = document.createElement("script");
            script.src = "http://localhost:8080/embed.js";
            script.onload = function () {
                QuackBoard.init({
                    elementId: "quackboard-calendar-saafir-bhimani",
                    producerSlug: "saafir-bhimani",
                    baseUrl: "http://localhost:8080"
                });
            };
            document.head.appendChild(script);
        })();
    </script>

</body>

</html>
