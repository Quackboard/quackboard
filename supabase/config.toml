# QuackBoard local stack — ports in the 5542x range so another Supabase project
# on the default 5432x ports (e.g. a different repo) can run at the same time.
# Docs: https://supabase.com/docs/guides/cli/local-development

project_id = "dkbahxjibpobbefqufqa"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 55422
shadow_port = 55418
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false
port = 55429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = true
port = 55423
api_url = "http://127.0.0.1:55421"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 55424

[realtime]
enabled = true

# Vite defaults to http://localhost:8080 in this repo
[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080", "http://localhost:8080"]

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Inspector only — keep away from Vite (:8080) and default 8083 used by Supabase starter
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 45583
deno_version = 2

[analytics]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[functions.auth-email-hook]
verify_jwt = false

[functions.cancel-booking]
verify_jwt = false

[functions.create-booking]
verify_jwt = false

[functions.regenerate-recurring-events]
verify_jwt = false
